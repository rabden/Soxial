name: pr-agent review

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr_agent_job:
    if: |
      github.repository == 'rabden/Soxial' &&
      (github.actor == 'rabden' || github.actor == 'kubenstein')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Run pr-agent
        id: pr_agent
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.ZEN_API_KEY }}
          OPENAI.API_BASE: "https://opencode.ai/zen/v1"
          config.model: "openai/deepseek-v4-flash-free"
          config.fallback_models: '["openai/big-pickle"]'
          config.custom_model_max_tokens: "64000"
          config.custom_reasoning_model: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"

  qodo_review_report:
    needs: pr_agent_job
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Report qodo-review check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          case "${{ needs.pr_agent_job.result }}" in
            success)
              conclusion="success"; desc="qodo review completed" ;;
            skipped)
              conclusion="skipped"; desc="skipped - PR author is not a trusted collaborator" ;;
            *)
              conclusion="failure"; desc="qodo review failed" ;;
          esac
          gh api -X POST "repos/rabden/Soxial/check-runs" \
            -f name="qodo-review" \
            -f head_sha="$SHA" \
            -f status="completed" \
            -f conclusion="$conclusion" \
            -f "output[title]=qodo review" \
            -f "output[summary]=$desc" \
            -f "details_url=https://github.com/rabden/Soxial/actions/runs/${{ github.run_id }}"
