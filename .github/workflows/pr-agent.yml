name: pr-agent review

# Primary model is Google AI Studio Gemini; fallback is the Zen primary.
# Switch them via repo variables without a commit:
# - GEMINI_PRIMARY_MODEL (e.g. gemini-3.8-flash)
# - ZEN_PRIMARY_MODEL (e.g. muse-spark-1.3-contributor-free, see https://opencode.ai/docs/zen)
env:
  GEMINI_PRIMARY_MODEL: ${{ vars.GEMINI_PRIMARY_MODEL || 'gemini-3.8-flash' }}
  ZEN_PRIMARY_MODEL: ${{ vars.ZEN_PRIMARY_MODEL || 'muse-spark-1.3-contributor-free' }}

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr_agent_job:
    # Runs for anyone associated with the repo (owner, member, collaborator,
    # or past contributor) — no hardcoded usernames. First-time/external
    # fork authors are skipped to protect API quota; drop the second clause
    # to review literally every PR.
    if: |
      github.repository == 'rabden/Soxial' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Run pr-agent
        id: pr_agent
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_KEY: ${{ secrets.ZEN_API_KEY }}
          OPENAI.API_BASE: "https://opencode.ai/zen/v1"
          config.model: "gemini/${{ env.GEMINI_PRIMARY_MODEL }}"
          config.fallback_models: ${{ format('["openai/{0}"]', env.ZEN_PRIMARY_MODEL) }}
          # Budgets: gemini-3.8-flash is a known 1M model, so max_model_tokens
          # caps the primary at 300k (free-tier quota). The Zen fallback is
          # unknown, so custom_model_max_tokens asks 500k — but max_model_tokens
          # caps everything, so the fallback effectively gets 300k too. Qodo has
          # no per-model budget; raise max to 500000 to unlock the full Zen
          # budget (primary then also goes to 500k).
          config.custom_model_max_tokens: "500000"
          config.max_model_tokens: "300000"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"

  qodo_review_report:
    needs: pr_agent_job
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Report qodo-review check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          case "${{ needs.pr_agent_job.result }}" in
            success)
              conclusion="success"; desc="qodo review completed" ;;
            skipped)
              conclusion="skipped"; desc="skipped - PR author is not a trusted collaborator" ;;
            *)
              conclusion="failure"; desc="qodo review failed" ;;
          esac
          gh api -X POST "repos/rabden/Soxial/check-runs" \
            -f name="qodo-review" \
            -f head_sha="$SHA" \
            -f status="completed" \
            -f conclusion="$conclusion" \
            -f "output[title]=qodo review" \
            -f "output[summary]=$desc" \
            -f "details_url=https://github.com/rabden/Soxial/actions/runs/${{ github.run_id }}"
